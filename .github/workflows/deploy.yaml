name: couldfare-worker-deploy

on:
  push:
    branches:
      - main
      - 'preview-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --no-dev --locked
      - run: uv run --no-dev build.py
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./deploy/public/
  
  production-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: deploy/public/
      - uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config deploy/wrangler.jsonc --message "${{ github.ref_name }}@${{ github.sha }}"
  
  preview-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'preview-')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: deploy/public/
      - uses: cloudflare/wrangler-action@v4
        with:
          environment: preview
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config deploy/wrangler.jsonc --message "${{ github.ref_name }}@${{ github.sha }}"
